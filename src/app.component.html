<div class="min-h-screen max-w-lg mx-auto bg-gray-50 flex flex-col shadow-2xl relative overflow-hidden">
  
  <!-- Content Area -->
  <main class="flex-1 overflow-hidden relative">
    <div class="absolute inset-0 p-4 pb-24 overflow-y-auto scroll-smooth">
      @switch (currentView()) {
        @case ('dashboard') {
          <app-dashboard />
        }
        @case ('medicines') {
          <app-medicines />
        }
        @case ('appointments') {
          <app-appointments />
        }
      }
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bg-white border-t border-gray-200 px-6 py-3 flex justify-between items-center absolute bottom-0 w-full z-10">
    
    <button (click)="currentView.set('dashboard')" 
            class="flex flex-col items-center gap-1 w-16 transition-colors duration-200"
            [class.text-blue-600]="currentView() === 'dashboard'"
            [class.text-gray-400]="currentView() !== 'dashboard'">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="text-[10px] font-medium">Home</span>
    </button>

    <button (click)="currentView.set('medicines')" 
            class="flex flex-col items-center gap-1 w-16 transition-colors duration-200"
            [class.text-blue-600]="currentView() === 'medicines'"
            [class.text-gray-400]="currentView() !== 'medicines'">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
      </svg>
      <span class="text-[10px] font-medium">Meds</span>
    </button>

    <button (click)="currentView.set('appointments')" 
            class="flex flex-col items-center gap-1 w-16 transition-colors duration-200"
            [class.text-blue-600]="currentView() === 'appointments'"
            [class.text-gray-400]="currentView() !== 'appointments'">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span class="text-[10px] font-medium">Visits</span>
    </button>
  </nav>
</div>
